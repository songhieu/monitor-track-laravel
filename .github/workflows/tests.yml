name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}${{ matrix.lowest && ' · lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '8', phpunit: '10.5' }
          - { php: '8.1', laravel: '10', testbench: '8', phpunit: '10.5', lowest: true }
          - { php: '8.2', laravel: '11', testbench: '9', phpunit: '11' }
          - { php: '8.3', laravel: '11', testbench: '9', phpunit: '11' }
          - { php: '8.3', laravel: '12', testbench: '10', phpunit: '11' }
          - { php: '8.4', laravel: '12', testbench: '10', phpunit: '11' }
          - { php: '8.3', laravel: '13', testbench: '11', phpunit: '12' }
          - { php: '8.4', laravel: '13', testbench: '11', phpunit: '12' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev --no-update \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:^${{ matrix.testbench }}.0" \
            "phpunit/phpunit:^${{ matrix.phpunit }}"
          composer update --prefer-dist --no-interaction --no-progress -W ${{ matrix.lowest && '--prefer-lowest' || '' }}

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=never
